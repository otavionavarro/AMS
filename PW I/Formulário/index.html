<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="descripition" content="Formulario de contato Dev">
    <meta name="keywords" content="HTML, CSS, Formulario, Contato">
    <link rel="stylesheet" href="">
    <title>Cadastro Dev</title>
</head>
<body>
    <main>
        <div class="header">
            <h1 id="titulo">Cadastro Dev's</h1>
            <p id="subtitulo">Complete suas informações</p>
        </div>
        <form action="#" method="post" autocomplete="off">
            <fieldset class="grupo">
                <div class="campo">
                    <label for="nome"><strong>Nome</strong></label>
                    <input type="text" name="nome" id="nome" required>
                </div>
                <div class="campo">
                <label for="sobrenome"><strong>Sobrenome</strong></label>
                <input type="text" name="sobrenome" id="sobrenome" required>
                </div>
                </fieldset>
                <div class="campo">
                    <label for="email"><strong>Email</strong></label>
                    <input type="text" name="email" id="email" required>
                </div>
                <div class="campo">
                    <label><strong>De qual lado da aplicação você desenvolve?</strong></label>
                    <label>
                        <input type="radio" name="devweb" value="frontend" checked> Front-end
                    </label>
                    <label>
                        <input type="radio" name="devweb" value="backend" checked> Back-end
                    </label>
                    <label>
                        <input type="radio" name="devweb" value="fullstrack" checked> Fullstrack
                    </label>
                </div>
                <div class="campo">
                    <label for="senioridade"><strong>Senioridade</strong></label>
                    <select name="senioridade" id="senioridade">
                        <option select disabled value="">Select</option>
                        <option value="junior">Junior</option>
                        <option value="pleno">Pleno</option>
                        <option value="senior">Senior</option>
                    </select>
                </div>
                <fieldset class="grupo">
                    <legend><strong>Selecione as tecnologias que utilize:</strong></legend>
                    <label>
                    <input type="checkbox" name="tecnologia" id="html"> HTML
                    </label>
                    <label>
                    <input type="checkbox" name="tecnologia" id="css"> CSS
                    </label>
                    <label>
                    <input type="checkbox" name="tecnologia" id="javascript"> Javascript
                    </label>
                    <label>
                    <input type="checkbox" name="tecnologia" id="php"> PHP
                    </label>
                    <label>
                    <input type="checkbox" name="tecnologia" id="csharp"> C#
                    </label>
                    <label>
                    <input type="checkbox" name="tecnologia" id="python"> Python
                    </label>
                    <label>
                    <input type="checkbox" name="tecnologia" id="java"> Java
                    </label>
                </fieldset>
                
        </form>
    </main>
</body>
</html>
